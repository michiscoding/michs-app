<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>home</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="mishi">
</head>
<body>

    <div class="dash-wrap">
        <div class="dash-hero" id="dash-hero" style="display:none">
            <img id="dash-photo-img" src="" alt="" style="opacity:0;transition:opacity 0.5s">
            <div class="dash-hero-date" id="dash-hero-date"></div>
        </div>
        <div class="dash-stats">
            <a href="entry.html" class="dash-stat">
                <div class="dash-stat-num" id="dash-entry-icon">—</div>
                <div class="dash-stat-label">today's entry</div>
            </a>
            <div class="dash-stat">
                <div class="dash-stat-num" id="dash-jj-num">—</div>
                <div class="dash-stat-label">jj this month</div>
            </div>
        </div>
        <div class="dash-thought" id="dash-thought" style="display:none"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
    <script src="js/nav.js"></script>
    <script>
        const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

        async function loadDash() {
            const now = new Date();
            const todayStr = now.toISOString().slice(0, 10);
            const monthStart = todayStr.slice(0, 8) + '01';

            const [photoRes, entryRes, jjRes] = await Promise.all([
                db.from('entry_photos').select('storage_path, entry_date').order('entry_date', { ascending: false }).limit(40),
                db.from('entries').select('content, thought').eq('date', todayStr).maybeSingle(),
                db.from('jiu_jitsu').select('date', { count: 'exact', head: true }).gte('date', monthStart).lte('date', todayStr)
            ]);

            // random recent photo
            const photos = (photoRes.data || []).filter(p => p.storage_path);
            if (photos.length) {
                const pick = photos[Math.floor(Math.random() * photos.length)];
                const hero = document.getElementById('dash-hero');
                const img = document.getElementById('dash-photo-img');
                img.onload = () => { img.style.opacity = '1'; };
                img.src = pick.storage_path.startsWith('http') ? pick.storage_path : MEDIA_BASE + pick.storage_path;
                const [, mm, dd] = pick.entry_date.split('-');
                document.getElementById('dash-hero-date').textContent = `${months[parseInt(mm)-1]} ${parseInt(dd)}`;
                hero.style.display = '';
            }

            // today's entry
            const wrote = entryRes.data?.content?.trim();
            const entryIcon = document.getElementById('dash-entry-icon');
            entryIcon.textContent = wrote ? '✓' : '×';
            entryIcon.style.color = wrote ? '#4caf50' : '#ccc';

            // jj this month
            document.getElementById('dash-jj-num').textContent = jjRes.count ?? 0;

            // today's thought
            const thought = entryRes.data?.thought?.trim();
            if (thought) {
                const el = document.getElementById('dash-thought');
                el.textContent = `"${thought}"`;
                el.style.display = '';
            }

            document.body.style.opacity = '1';
        }

        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.4s';
        loadDash();
    </script>
</body>
</html>
