<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>home</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="mishi">
</head>
<body>

    <div class="dash-wrap">
        <div class="dash-photo-grid" id="dash-grid"></div>
        <div class="dash-stats">
            <a href="entry.html" class="dash-stat">
                <div class="dash-stat-num" id="dash-entry-icon">—</div>
                <div class="dash-stat-label">today's entry</div>
            </a>
            <div class="dash-stat">
                <div class="dash-stat-num" id="dash-jj-num">—</div>
                <div class="dash-stat-label">jj this month</div>
            </div>
        </div>
        <div class="dash-thought" id="dash-thought" style="display:none"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
    <script src="js/nav.js"></script>
    <script>
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        async function loadDash() {
            const now = new Date();
            const todayStr = now.toISOString().slice(0, 10);
            const monthStart = todayStr.slice(0, 8) + '01';

            const [photoRes, entryRes, jjRes] = await Promise.all([
                db.from('entry_photos').select('storage_path, entry_date').order('entry_date', { ascending: false }).limit(80),
                db.from('entries').select('content, thought').eq('date', todayStr).maybeSingle(),
                db.from('jiu_jitsu').select('date', { count: 'exact', head: true }).gte('date', monthStart).lte('date', todayStr)
            ]);

            // randomized photo grid (9 picks)
            const photos = shuffle((photoRes.data || []).filter(p => p.storage_path));
            const grid = document.getElementById('dash-grid');
            photos.slice(0, 9).forEach(p => {
                const cell = document.createElement('div');
                cell.className = 'dash-photo-cell';
                const img = document.createElement('img');
                img.src = p.storage_path.startsWith('http') ? p.storage_path : MEDIA_BASE + p.storage_path;
                img.alt = '';
                img.onload = () => { img.style.opacity = '1'; };
                cell.appendChild(img);
                grid.appendChild(cell);
            });
            if (!photos.length) grid.style.display = 'none';

            // today's entry
            const wrote = entryRes.data?.content?.trim();
            const entryIcon = document.getElementById('dash-entry-icon');
            entryIcon.textContent = wrote ? '✓' : '×';
            entryIcon.style.color = wrote ? '#4caf50' : '#ccc';

            // jj this month
            document.getElementById('dash-jj-num').textContent = jjRes.count ?? 0;

            // today's thought
            const thought = entryRes.data?.thought?.trim();
            if (thought) {
                const el = document.getElementById('dash-thought');
                el.textContent = `"${thought}"`;
                el.style.display = '';
            }

            document.body.style.opacity = '1';
        }

        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.4s';
        loadDash();
    </script>
</body>
</html>
