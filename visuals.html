<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>visuals</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="mishi">
</head>

<body>



    <div class="entry-container visuals-container">
        <h1>visuals</h1>

        <label id="drop-zone" for="file-input">
            <p>drop a photo or video here</p>
            <span>or browse files</span>
            <input type="file" id="file-input" accept="image/*,video/*,.heic,.heif" multiple>
        </label>

        <div id="preview-container">
            <div id="preview-wrapper">
                <div class="col" id="col-0"></div>
                <div class="col" id="col-1"></div>
                <div class="col" id="col-2"></div>
            </div>
            <div id="preview-actions">
                <button type="button" id="add-btn">+ add another</button>
                <button type="button" id="post-btn" class="btn-app">post</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/lite.umd.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/visuals.js"></script>
</body>
</html>
