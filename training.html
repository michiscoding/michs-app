<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>jiu jitsu</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="mishi">
</head>

<body>
    <datalist id="jj-time-options">
        <option value="9:30am">
        <option value="11am">
        <option value="12pm">
        <option value="5:30pm">
        <option value="6:45pm">
    </datalist>

    <div class="entry-container">
        <div id="jj-list-view">
            <div class="page-title-row">
                <h1>jiu jitsu</h1>
                <button type="button" class="btn-inline" id="jj-new-btn">+ new entry</button>
            </div>
            <div id="jj-filters">
                <select id="jj-year-filter" aria-label="filter by year"></select>
                <select id="jj-month-filter" aria-label="filter by month"></select>
                <button type="button" id="jj-filter-clear">×</button>
            </div>
            <div id="jj-entries-list"></div>
            <button type="button" class="btn-inline" id="jj-migrate-btn" style="display:none;margin-top:2rem">↑ migrate from old table</button>
        </div>

        <div id="jj-editor-view" style="display:none">
            <button type="button" id="jj-back-btn" class="entry-nav-btn" style="margin-bottom:0.5rem">← back</button>
            <div class="entry-day-nav" id="jj-existing-date-group">
                <button type="button" id="jj-prev-btn" class="entry-nav-btn entry-nav-hidden">←</button>
                <span id="jj-editor-title" contenteditable="true" spellcheck="false"></span>
                <button type="button" id="jj-next-btn" class="entry-nav-btn entry-nav-hidden">→</button>
            </div>
            <div id="jj-new-date-group" style="display:none">
                <input type="date" id="jj-new-date">
            </div>

            <div id="jj-sessions-container"></div>
            <button type="button" class="btn-inline" id="jj-add-session-btn">+ add session</button>

            <div class="editor-actions">
                <button type="button" id="jj-save-btn" class="btn-app">save</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
    <script src="js/nav.js"></script>
    <script>
        const jjListView = document.getElementById('jj-list-view');
        const jjEditorView = document.getElementById('jj-editor-view');
        const jjEditorTitle = document.getElementById('jj-editor-title');
        const jjYearFilter = document.getElementById('jj-year-filter');
        const jjMonthFilter = document.getElementById('jj-month-filter');
        const jjMonths = ['january','february','march','april','may','june','july','august','september','october','november','december'];
        let allJJFiles = [];
        let jjCurrentDate = null;

        function setSiteLink(url) {
            document.querySelectorAll('.app-site-link').forEach(l => l.href = url || 'https://michiscoding.github.io/home.html');
        }

        function jjCodeToIso(code) {
            if (!/^\d{6}$/.test(code)) return null;
            return `20${code.slice(4,6)}-${code.slice(0,2)}-${code.slice(2,4)}`;
        }
        function jjIsoToCode(iso) {
            const [yyyy, mm, dd] = iso.split('-');
            return `${mm}${dd}${yyyy.slice(2)}`;
        }

        function showList() {
            jjEditorView.style.display = 'none';
            jjListView.style.display = '';
            setSiteLink('https://michiscoding.github.io/training.html');
        }

        function renderJJList() {
            const jjList = document.getElementById('jj-entries-list');
            jjList.innerHTML = '';
            const yr = jjYearFilter.value;
            const mo = jjMonthFilter.value;
            const filtered = allJJFiles.filter(f => {
                const [yyyy, mm] = f.name.split('-');
                return (yr === 'all' || yyyy === yr) && (mo === 'all' || mm === mo);
            });
            const groups = {};
            for (const file of filtered) {
                const [yyyy, mm] = file.name.split('-');
                if (!groups[yyyy]) groups[yyyy] = {};
                if (!groups[yyyy][mm]) groups[yyyy][mm] = [];
                groups[yyyy][mm].push(file);
            }
            for (const yyyy of Object.keys(groups).sort().reverse()) {
                const yearEl = document.createElement('div');
                yearEl.className = 'entry-year-label';
                yearEl.textContent = yyyy;
                jjList.appendChild(yearEl);
                for (const mm of Object.keys(groups[yyyy]).sort().reverse()) {
                    const row = document.createElement('div');
                    row.className = 'entry-month-row';
                    const monthName = document.createElement('span');
                    monthName.className = 'entry-month-name';
                    monthName.textContent = jjMonths[parseInt(mm) - 1];
                    row.appendChild(monthName);
                    const chips = document.createElement('div');
                    chips.className = 'entry-day-chips';
                    const sorted = groups[yyyy][mm].slice().sort((a, b) => parseInt(b.name.split('-')[2]) - parseInt(a.name.split('-')[2]));
                    for (const file of sorted) {
                        const dd = parseInt(file.name.split('-')[2]);
                        const chip = document.createElement('button');
                        chip.type = 'button';
                        chip.className = 'entry-day-chip';
                        chip.textContent = dd;
                        chip.addEventListener('click', () => openJJEntry(file.name));
                        chips.appendChild(chip);
                    }
                    row.appendChild(chips);
                    jjList.appendChild(row);
                }
            }
        }

        function rebuildJJMonthFilter() {
            const yr = jjYearFilter.value;
            const seenMo = new Set();
            jjMonthFilter.innerHTML = '<option value="all">month</option>';
            allJJFiles.forEach(f => {
                const [yyyy, mm] = f.name.split('-');
                if ((yr === 'all' || yyyy === yr) && !seenMo.has(mm)) {
                    seenMo.add(mm);
                    const opt = document.createElement('option');
                    opt.value = mm;
                    opt.textContent = jjMonths[parseInt(mm) - 1];
                    jjMonthFilter.appendChild(opt);
                }
            });
        }

        jjYearFilter.addEventListener('change', () => { rebuildJJMonthFilter(); renderJJList(); });
        jjMonthFilter.addEventListener('change', renderJJList);
        document.getElementById('jj-filter-clear').addEventListener('click', () => {
            jjYearFilter.value = 'all'; rebuildJJMonthFilter(); renderJJList();
        });

        // --- session cards ---

        function createSessionCard(session) {
            const card = document.createElement('div');
            card.className = 'jj-session-card';
            card.innerHTML = `
                <button type="button" class="jj-remove-btn" aria-label="remove session">×</button>
                <div class="field-group">
                    <label class="field-label">notes</label>
                    <div class="jj-notes-row">
                        <input type="text" list="jj-time-options" class="jj-time-input" placeholder="time">
                        <textarea class="jj-notes"></textarea>
                    </div>
                </div>
                <div class="field-group">
                    <label class="field-label">techniques</label>
                    <input type="text" class="jj-techniques" placeholder="comma separated...">
                </div>
                <div class="field-group">
                    <label class="field-label">partners</label>
                    <input type="text" class="jj-partners" placeholder="comma separated...">
                </div>`;

            card.querySelector('.jj-time-input').value = session.time || '';
            card.querySelector('.jj-techniques').value = (session.techniques || []).join(', ');
            card.querySelector('.jj-partners').value = (session.partners || []).join(', ');

            const ta = card.querySelector('.jj-notes');
            ta.value = session.notes || '';
            requestAnimationFrame(() => {
                ta.style.height = 'auto';
                ta.style.height = ta.scrollHeight + 'px';
            });
            ta.addEventListener('input', () => {
                ta.style.height = 'auto';
                ta.style.height = ta.scrollHeight + 'px';
            });

            card.querySelector('.jj-remove-btn').addEventListener('click', () => {
                if (document.getElementById('jj-sessions-container').children.length > 1) card.remove();
            });

            return card;
        }

        function renderSessionCards(sessions) {
            const container = document.getElementById('jj-sessions-container');
            container.innerHTML = '';
            (sessions?.length ? sessions : [{}]).forEach(s => container.appendChild(createSessionCard(s)));
        }

        // --- DB ---

        async function loadJJ() {
            const { data } = await db.from('jiu_jitsu_sessions').select('date').order('date', { ascending: false });
            const seen = new Set();
            allJJFiles = (data || []).filter(r => {
                if (seen.has(r.date)) return false;
                seen.add(r.date); return true;
            }).map(r => ({ name: r.date }));

            const seenYr = new Set();
            jjYearFilter.innerHTML = '<option value="all">year</option>';
            allJJFiles.forEach(f => {
                const [yyyy] = f.name.split('-');
                if (!seenYr.has(yyyy)) {
                    seenYr.add(yyyy);
                    const opt = document.createElement('option');
                    opt.value = yyyy; opt.textContent = yyyy;
                    jjYearFilter.appendChild(opt);
                }
            });
            rebuildJJMonthFilter();
            renderJJList();
            document.getElementById('jj-migrate-btn').style.display = allJJFiles.length ? 'none' : '';
        }

        async function openJJEntry(date) {
            const [{ data: sessions }, { data: prevRows }, { data: nextRows }] = await Promise.all([
                db.from('jiu_jitsu_sessions').select('*').eq('date', date).order('created_at', { ascending: true }),
                db.from('jiu_jitsu_sessions').select('date').lt('date', date).order('date', { ascending: false }).limit(1),
                db.from('jiu_jitsu_sessions').select('date').gt('date', date).order('date', { ascending: true }).limit(1)
            ]);

            jjCurrentDate = date;
            jjEditorTitle.textContent = jjIsoToCode(date);
            renderSessionCards(sessions);

            const prevDate = prevRows?.[0]?.date;
            const nextDate = nextRows?.[0]?.date;
            const prevBtn = document.getElementById('jj-prev-btn');
            const nextBtn = document.getElementById('jj-next-btn');
            prevBtn.classList.toggle('entry-nav-hidden', !prevDate);
            nextBtn.classList.toggle('entry-nav-hidden', !nextDate);
            prevBtn.onclick = prevDate ? () => openJJEntry(prevDate) : null;
            nextBtn.onclick = nextDate ? () => openJJEntry(nextDate) : null;

            document.getElementById('jj-existing-date-group').style.display = '';
            document.getElementById('jj-new-date-group').style.display = 'none';
            setSiteLink(`https://michiscoding.github.io/jiu-jitsu/view.html?date=${date}`);
            jjListView.style.display = 'none';
            jjEditorView.style.display = 'block';
        }

        document.getElementById('jj-back-btn').addEventListener('click', showList);

        document.getElementById('jj-new-btn').addEventListener('click', () => {
            jjCurrentDate = null;
            document.getElementById('jj-existing-date-group').style.display = 'none';
            document.getElementById('jj-new-date-group').style.display = '';
            document.getElementById('jj-new-date').value = new Date().toISOString().slice(0,10);
            renderSessionCards([]);
            setSiteLink('https://michiscoding.github.io/training.html');
            jjListView.style.display = 'none';
            jjEditorView.style.display = 'block';
        });

        document.getElementById('jj-add-session-btn').addEventListener('click', () => {
            const card = createSessionCard({});
            document.getElementById('jj-sessions-container').appendChild(card);
            card.querySelector('.jj-time-input').focus();
        });

        document.getElementById('jj-save-btn').addEventListener('click', async () => {
            const date = jjCurrentDate || document.getElementById('jj-new-date').value;
            if (!date) return;
            const adminDb = await getAdminClient();
            if (!adminDb) return;
            const btn = document.getElementById('jj-save-btn');
            btn.textContent = 'saving...';

            const sessions = Array.from(document.querySelectorAll('.jj-session-card')).map(card => ({
                date,
                time: card.querySelector('.jj-time-input').value.trim() || null,
                notes: card.querySelector('.jj-notes').value,
                techniques: card.querySelector('.jj-techniques').value.split(',').map(s => s.trim()).filter(Boolean),
                partners: card.querySelector('.jj-partners').value.split(',').map(s => s.trim()).filter(Boolean),
            })).filter(s => s.notes || s.time);

            if (!sessions.length) {
                btn.textContent = 'nothing to save';
                setTimeout(() => btn.textContent = 'save', 2000);
                return;
            }

            const { error: delErr } = await adminDb.from('jiu_jitsu_sessions').delete().eq('date', date);
            if (delErr) { btn.textContent = 'error'; console.error(delErr); setTimeout(() => btn.textContent = 'save', 3000); return; }

            const { error: insErr } = await adminDb.from('jiu_jitsu_sessions').insert(sessions);
            if (insErr) { btn.textContent = 'error'; console.error(insErr); setTimeout(() => btn.textContent = 'save', 3000); return; }

            jjCurrentDate = date;
            if (!allJJFiles.find(f => f.name === date)) {
                allJJFiles.push({ name: date });
                allJJFiles.sort((a, b) => b.name.localeCompare(a.name));
                rebuildJJMonthFilter();
                renderJJList();
            }
            document.getElementById('jj-migrate-btn').style.display = 'none';
            setSiteLink(`https://michiscoding.github.io/jiu-jitsu/view.html?date=${date}`);
            btn.textContent = 'saved!';
            setTimeout(() => btn.textContent = 'save', 2000);
        });

        // --- migration ---

        function parseJJContent(content) {
            if (!content?.trim()) return [];
            const timeRe = /^(\d{1,4}(?::\d{2})?(?:a|am|p|pm)?)\s*-\s+/i;
            const lines = content.split('\n');
            const sessions = [];
            let current = null;
            for (const line of lines) {
                const m = line.match(timeRe);
                if (m) {
                    if (current) sessions.push(current);
                    current = { time: m[1], notes: line.slice(m[0].length) };
                } else if (current) {
                    current.notes += '\n' + line;
                } else {
                    current = { time: null, notes: line };
                }
            }
            if (current) sessions.push(current);
            sessions.forEach(s => { s.notes = s.notes.trim(); });
            return sessions.length ? sessions : [{ time: null, notes: content.trim() }];
        }

        document.getElementById('jj-migrate-btn').addEventListener('click', async () => {
            const adminDb = await getAdminClient();
            if (!adminDb) return;
            const btn = document.getElementById('jj-migrate-btn');
            btn.textContent = 'reading...';

            const { data: oldData, error } = await db.from('jiu_jitsu').select('date, content, techniques, partners').order('date', { ascending: true });
            if (error || !oldData?.length) {
                btn.textContent = error ? 'error reading old table' : 'no old data found';
                setTimeout(() => btn.textContent = '↑ migrate from old table', 3000);
                return;
            }

            const sessions = [];
            for (const row of oldData) {
                const parsed = parseJJContent(row.content);
                parsed.forEach((s, i) => {
                    sessions.push({
                        date: row.date,
                        time: s.time,
                        notes: s.notes,
                        techniques: i === parsed.length - 1 ? (row.techniques || []) : [],
                        partners: i === parsed.length - 1 ? (row.partners || []) : [],
                    });
                });
            }

            if (!confirm(`found ${sessions.length} sessions across ${oldData.length} dates. migrate now?`)) {
                btn.textContent = '↑ migrate from old table';
                return;
            }

            btn.textContent = 'migrating...';
            const { error: insErr } = await adminDb.from('jiu_jitsu_sessions').insert(sessions);
            if (insErr) {
                btn.textContent = 'error — check console';
                console.error(insErr);
                setTimeout(() => btn.textContent = '↑ migrate from old table', 3000);
                return;
            }

            btn.style.display = 'none';
            btn.textContent = '↑ migrate from old table';
            loadJJ();
        });

        loadJJ();
    </script>
</body>
</html>
