<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>entry</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="mishi">
</head>

<body>



    <div class="entry-container" id="entry-edit-view">
        <div class="entry-day-nav">
            <button type="button" id="entry-prev-btn" class="entry-nav-btn entry-nav-hidden">←</button>
            <h1 id="date-label" contenteditable="true" spellcheck="false">new entry</h1>
            <button type="button" id="entry-next-btn" class="entry-nav-btn entry-nav-hidden">→</button>
            <button type="button" id="history-btn" class="entry-nav-btn" aria-label="browse entries">≡</button>
        </div>

        <div id="entry-carousel">
            <div id="entry-carousel-track">
                <div class="entry-slide">
                    <textarea aria-label="entry content"></textarea>
                </div>
                <div class="entry-slide" id="training-slide">
                    <label class="entry-field-label">notes</label>
                    <textarea id="training-notes"></textarea>
                    <label class="entry-field-label">techniques</label>
                    <input type="text" id="training-techniques" placeholder="comma separated...">
                    <label class="entry-field-label">partners</label>
                    <input type="text" id="training-partners" placeholder="comma separated...">
                </div>
            </div>
        </div>
        <div id="carousel-nav">
            <span role="button" tabindex="0" id="carousel-nav-back">← entry</span>
            <span role="button" tabindex="0" id="carousel-nav-fwd">training →</span>
        </div>

        <div id="music-field-group" style="display:none">
            <input type="text" id="music-input" placeholder="music url (spotify / youtube)...">
        </div>
        <div id="thought-field-group" style="display:none">
            <input type="text" id="thought-input" placeholder="a quote or thought for today...">
        </div>

        <div id="photo-strip">
            <div id="photo-previews"></div>
            <div id="entry-add-btns">
                <span role="button" tabindex="0" id="music-add-btn">+ add music</span>
                <span role="button" tabindex="0" id="thought-add-btn">+ add thought</span>
                <span role="button" tabindex="0" id="training-add-btn">+ add training</span>
                <label id="photo-add-btn" for="photo-input">+ add photos</label>
            </div>
            <input type="file" id="photo-input" accept="image/*,video/*" multiple>
        </div>

        <button type="button" id="post-btn" class="btn-app">save</button>
    </div>

    <div class="entry-container" id="entry-history-view" style="display:none">
        <div class="entry-day-nav">
            <button type="button" id="history-back-btn" class="entry-nav-btn">←</button>
            <h1>entries</h1>
        </div>
        <div id="browse-filters">
            <select id="browse-year-filter" aria-label="filter by year"></select>
            <select id="browse-month-filter" aria-label="filter by month"></select>
            <button type="button" id="browse-filter-clear">×</button>
        </div>
        <div id="browse-list"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/app.js"></script>
    <script src="js/nav.js"></script>
    <script>
        const textarea = document.querySelector('textarea');
        const dateLabel = document.getElementById('date-label');
        const photoInput = document.getElementById('photo-input');
        const photoPreviews = document.getElementById('photo-previews');
        const siteLinks = document.querySelectorAll('.app-site-link');
        const _d = new Date();
        const DEFAULT_CODE = `${String(_d.getMonth()+1).padStart(2,'0')}${String(_d.getDate()).padStart(2,'0')}${String(_d.getFullYear()).slice(2)}`;
        dateLabel.textContent = DEFAULT_CODE;

        function codeToIso(code) {
            if (!/^\d{6}$/.test(code)) return null;
            return `20${code.slice(4,6)}-${code.slice(0,2)}-${code.slice(2,4)}`;
        }

        function isoToCode(iso) {
            const [yyyy, mm, dd] = iso.split('-');
            return `${mm}${dd}${yyyy.slice(2)}`;
        }

        function currentDate() {
            return codeToIso(dateLabel.textContent.trim()) || codeToIso(DEFAULT_CODE);
        }

        const entryContent = [textarea, document.getElementById('photo-strip')];

        function fadeOut(cb) {
            entryContent.forEach(el => { el.style.transition = 'opacity 0.2s ease'; el.style.opacity = '0'; });
            setTimeout(cb, 200);
        }
        function fadeIn() {
            entryContent.forEach(el => { el.style.opacity = '1'; });
        }

        let photos = [];

        async function loadEntryForDate(date, animate) {
            const doLoad = async () => {
                textarea.value = '';
                textarea.style.height = '';
                photos = [];

                const [{ data: entryData }, { data: photoData }, { data: prevRows }, { data: nextRows }, { data: jjData }] = await Promise.all([
                    db.from('entries').select('content, music_url, thought').eq('date', date).single(),
                    db.from('entry_photos').select('storage_path').eq('entry_date', date),
                    db.from('entries').select('date').lt('date', date).order('date', { ascending: false }).limit(1),
                    db.from('entries').select('date').gt('date', date).order('date', { ascending: true }).limit(1),
                    db.from('jiu_jitsu').select('content, techniques, partners').eq('date', date).maybeSingle()
                ]);

                const musicVal = entryData?.music_url || '';
                const thoughtVal = entryData?.thought || '';
                document.getElementById('music-input').value = musicVal;
                document.getElementById('thought-input').value = thoughtVal;
                setFieldVisible('music', !!musicVal);
                setFieldVisible('thought', !!thoughtVal);

                const trainingNotes = jjData?.content || '';
                const trainingTech = (jjData?.techniques || []).join(', ');
                const trainingPartners = (jjData?.partners || []).join(', ');
                document.getElementById('training-notes').value = trainingNotes;
                document.getElementById('training-techniques').value = trainingTech;
                document.getElementById('training-partners').value = trainingPartners;
                slideCarousel(0);
                if (entryData?.content) {
                    textarea.value = entryData.content;
                    requestAnimationFrame(() => { textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px'; });
                }
                if (photoData?.length) {
                    photoData.forEach(p => photos.push({
                        type: 'existing',
                        storage_path: p.storage_path,
                        src: p.storage_path.startsWith('http') ? p.storage_path : MEDIA_BASE + p.storage_path
                    }));
                }
                renderAllPhotos();

                const prevDate = prevRows?.[0]?.date;
                const nextDate = nextRows?.[0]?.date;
                const prevBtn = document.getElementById('entry-prev-btn');
                const nextBtn = document.getElementById('entry-next-btn');
                prevBtn.classList.toggle('entry-nav-hidden', !prevDate);
                nextBtn.classList.toggle('entry-nav-hidden', !nextDate);
                prevBtn.onclick = prevDate ? () => { dateLabel.textContent = isoToCode(prevDate); loadEntryForDate(prevDate, true); } : null;
                nextBtn.onclick = nextDate ? () => { dateLabel.textContent = isoToCode(nextDate); loadEntryForDate(nextDate, true); } : null;

                siteLinks.forEach(l => l.href = `https://michiscoding.github.io/entries/view.html?date=${date}`);

                requestAnimationFrame(updateCarouselHeight);
                fadeIn();
            };
            if (animate) { fadeOut(doLoad); } else { await doLoad(); }
        }

        loadEntryForDate(currentDate(), false);

        dateLabel.addEventListener('blur', () => {
            const date = currentDate();
            if (!date) { dateLabel.textContent = DEFAULT_CODE; return; }
            loadEntryForDate(date, true);
        });

        photoInput.addEventListener('change', () => {
            Array.from(photoInput.files).forEach(addPhoto);
            photoInput.value = '';
        });

        function addPhoto(file) {
            photos.push({ type: 'new', file, name: sanitizeName(file.name), src: URL.createObjectURL(file) });
            renderAllPhotos();
        }

        function renderAllPhotos() {
            photoPreviews.innerHTML = '';
            photos.forEach((entry, i) => {
                const isVideo = entry.type === 'new' ? entry.file.type.startsWith('video/') : /\.(mp4|webm|mov)$/i.test(entry.storage_path || '');
                const thumb = document.createElement('div');
                thumb.className = 'photo-thumb';
                const media = document.createElement(isVideo ? 'video' : 'img');
                media.src = entry.src;
                if (isVideo) { media.muted = true; media.loop = true; media.autoplay = true; media.playsInline = true; }
                const removeBtn = document.createElement('button');
                removeBtn.type = 'button'; removeBtn.className = 'remove-btn'; removeBtn.textContent = '×';
                removeBtn.addEventListener('click', () => { photos.splice(i, 1); renderAllPhotos(); });
                const prevBtn = document.createElement('button');
                prevBtn.type = 'button'; prevBtn.className = 'photo-move-btn photo-move-prev'; prevBtn.textContent = '←'; prevBtn.disabled = i === 0;
                prevBtn.addEventListener('click', () => { [photos[i], photos[i-1]] = [photos[i-1], photos[i]]; renderAllPhotos(); });
                const nextBtn = document.createElement('button');
                nextBtn.type = 'button'; nextBtn.className = 'photo-move-btn photo-move-next'; nextBtn.textContent = '→'; nextBtn.disabled = i === photos.length - 1;
                nextBtn.addEventListener('click', () => { [photos[i], photos[i+1]] = [photos[i+1], photos[i]]; renderAllPhotos(); });
                thumb.appendChild(media); thumb.appendChild(removeBtn); thumb.appendChild(prevBtn); thumb.appendChild(nextBtn);
                photoPreviews.appendChild(thumb);
            });
        }

        function sanitizeName(name) {
            return name.toLowerCase().replace(/[^a-z0-9.\-_]/g, '-');
        }

        function setFieldVisible(name, visible) {
            document.getElementById(`${name}-field-group`).style.display = visible ? '' : 'none';
            updateToggleBtn(name);
        }

        function updateToggleBtn(name) {
            const field = document.getElementById(`${name}-input`);
            const btn = document.getElementById(`${name}-add-btn`);
            const shown = document.getElementById(`${name}-field-group`).style.display !== 'none';
            if (!shown) {
                btn.style.display = ''; btn.textContent = `+ add ${name}`;
            } else if (field.value.trim()) {
                btn.style.display = 'none';
            } else {
                btn.style.display = ''; btn.textContent = `- add ${name}`;
            }
        }

        function trainingHasContent() {
            return !!(document.getElementById('training-notes').value.trim() ||
                      document.getElementById('training-techniques').value.trim() ||
                      document.getElementById('training-partners').value.trim());
        }

        let carouselSlide = 0;

        function updateTrainingBtn() {
            const btn = document.getElementById('training-add-btn');
            const back = document.getElementById('carousel-nav-back');
            const fwd = document.getElementById('carousel-nav-fwd');
            const hasTraining = trainingHasContent();
            // + add training: only on slide 0 with no training
            btn.style.display = (carouselSlide === 0 && !hasTraining) ? '' : 'none';
            if (carouselSlide === 0 && !hasTraining) btn.textContent = '+ add training';
            // ← entry: only on slide 1
            back.style.display = carouselSlide === 1 ? '' : 'none';
            // training →: only on slide 0 with existing training
            fwd.style.display = (carouselSlide === 0 && hasTraining) ? '' : 'none';
        }

        function updateCarouselHeight() {
            const carousel = document.getElementById('entry-carousel');
            const slides = document.querySelectorAll('.entry-slide');
            carousel.style.height = slides[carouselSlide].scrollHeight + 'px';
        }

        function slideCarousel(idx) {
            carouselSlide = idx;
            document.getElementById('entry-carousel-track').style.transform = `translateX(-${idx * 100}%)`;
            requestAnimationFrame(updateCarouselHeight);
            updateTrainingBtn();
        }

        const trainingBtn = document.getElementById('training-add-btn');
        function handleTrainingToggle() {
            if (carouselSlide === 1 && !trainingHasContent()) {
                slideCarousel(0);
            } else if (carouselSlide === 0) {
                slideCarousel(1);
                document.getElementById('training-notes').focus();
            }
        }
        trainingBtn.addEventListener('click', handleTrainingToggle);
        trainingBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleTrainingToggle(); } });

        document.getElementById('carousel-nav-back').addEventListener('click', () => slideCarousel(0));
        document.getElementById('carousel-nav-fwd').addEventListener('click', () => slideCarousel(1));
        ['training-notes', 'training-techniques', 'training-partners'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateTrainingBtn);
        });

        document.getElementById('training-notes').addEventListener('input', function() {
            if (this.scrollHeight > this.clientHeight) this.style.height = this.scrollHeight + 'px';
            updateCarouselHeight();
        });

        ['music', 'thought'].forEach(name => {
            const btn = document.getElementById(`${name}-add-btn`);
            const field = document.getElementById(`${name}-input`);
            function handleToggle() {
                const shown = document.getElementById(`${name}-field-group`).style.display !== 'none';
                if (shown && !field.value.trim()) {
                    setFieldVisible(name, false);
                } else if (!shown) {
                    setFieldVisible(name, true);
                    field.focus();
                }
            }
            btn.addEventListener('click', handleToggle);
            btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleToggle(); } });
            field.addEventListener('input', () => updateToggleBtn(name));
        });

        textarea.addEventListener('input', () => {
            if (textarea.scrollHeight > textarea.clientHeight) textarea.style.height = textarea.scrollHeight + 'px';
            updateCarouselHeight();
        });

        document.getElementById('post-btn').addEventListener('click', async () => {
            const adminDb = await getAdminClient();
            if (!adminDb) return;
            const btn = document.getElementById('post-btn');
            btn.textContent = 'saving...';
            const date = currentDate();

            // Upload new photos and convert them to existing
            for (let i = 0; i < photos.length; i++) {
                const p = photos[i];
                if (p.type !== 'new') continue;
                const path = `entry-photos/${date}/${p.name}`;
                const ok = await uploadToR2(path, p.file);
                if (ok) photos[i] = { type: 'existing', storage_path: path, src: MEDIA_BASE + path };
            }

            const musicUrl = document.getElementById('music-input').value.trim() || null;
            const thought = document.getElementById('thought-input').value.trim() || null;
            const { error } = await adminDb.from('entries').upsert({ date, content: textarea.value, music_url: musicUrl, thought }, { onConflict: 'date' });
            if (error) {
                btn.textContent = 'error — check console';
                console.error(error);
                setTimeout(() => btn.textContent = 'save', 3000);
                return;
            }

            // Delete all and re-insert in current order
            await adminDb.from('entry_photos').delete().eq('entry_date', date);
            const allPaths = photos.filter(p => p.storage_path).map(p => p.storage_path);
            if (allPaths.length) {
                await adminDb.from('entry_photos').insert(allPaths.map(p => ({ entry_date: date, storage_path: p })));
            }

            renderAllPhotos();

            if (trainingHasContent()) {
                const techniques = document.getElementById('training-techniques').value.split(',').map(s => s.trim()).filter(Boolean);
                const partners = document.getElementById('training-partners').value.split(',').map(s => s.trim()).filter(Boolean);
                await adminDb.from('jiu_jitsu').upsert(
                    { date, content: document.getElementById('training-notes').value, techniques, partners },
                    { onConflict: 'date' }
                );
            }

            btn.textContent = 'saved!';
            setTimeout(() => btn.textContent = 'save', 2000);
        });

        // --- browse past entries ---
        const browseMonths = ['january','february','march','april','may','june','july','august','september','october','november','december'];
        let allBrowseFiles = [];
        let browseLoaded = false;

        function renderBrowseList() {
            const yr = document.getElementById('browse-year-filter').value;
            const mo = document.getElementById('browse-month-filter').value;
            const list = document.getElementById('browse-list');
            list.innerHTML = '';
            const filtered = allBrowseFiles.filter(f => {
                const [yyyy, mm] = f.split('-');
                return (yr === 'all' || yyyy === yr) && (mo === 'all' || mm === mo);
            });
            const groups = {};
            for (const d of filtered) {
                const [yyyy, mm] = d.split('-');
                if (!groups[yyyy]) groups[yyyy] = {};
                if (!groups[yyyy][mm]) groups[yyyy][mm] = [];
                groups[yyyy][mm].push(d);
            }
            for (const yyyy of Object.keys(groups).sort().reverse()) {
                const yearEl = document.createElement('div');
                yearEl.className = 'entry-year-label';
                yearEl.textContent = yyyy;
                list.appendChild(yearEl);
                const monthsGrid = document.createElement('div');
                monthsGrid.className = 'entry-year-months';
                list.appendChild(monthsGrid);
                for (const mm of Object.keys(groups[yyyy]).sort().reverse()) {
                    const row = document.createElement('div');
                    row.className = 'entry-month-row';
                    const monthName = document.createElement('span');
                    monthName.className = 'entry-month-name';
                    monthName.textContent = browseMonths[parseInt(mm) - 1];
                    row.appendChild(monthName);
                    const grid = document.createElement('div');
                    grid.className = 'entry-day-chips';
                    const entrySet = new Set(groups[yyyy][mm].map(d => parseInt(d.split('-')[2])));
                    const daysInMonth = new Date(parseInt(yyyy), parseInt(mm), 0).getDate();
                    const firstDow = new Date(parseInt(yyyy), parseInt(mm) - 1, 1).getDay();
                    for (let day = 1; day <= daysInMonth; day++) {
                        const hasEntry = entrySet.has(day);
                        const cell = document.createElement(hasEntry ? 'button' : 'span');
                        cell.className = hasEntry ? 'entry-day-chip' : 'entry-day-empty';
                        cell.textContent = day;
                        if (day === 1) cell.style.gridColumnStart = firstDow + 1;
                        if (hasEntry) {
                            cell.type = 'button';
                            const isoDate = `${yyyy}-${mm}-${String(day).padStart(2, '0')}`;
                            cell.addEventListener('click', () => {
                                dateLabel.textContent = isoToCode(isoDate);
                                loadEntryForDate(isoDate, true);
                                document.getElementById('entry-history-view').style.display = 'none';
                                document.getElementById('entry-edit-view').style.display = '';
                            });
                        }
                        grid.appendChild(cell);
                    }
                    row.appendChild(grid);
                    monthsGrid.appendChild(row);
                }
            }
        }

        function rebuildBrowseMonthFilter() {
            const yr = document.getElementById('browse-year-filter').value;
            const mf = document.getElementById('browse-month-filter');
            const seenMo = new Set();
            mf.innerHTML = '<option value="all">month</option>';
            allBrowseFiles.forEach(d => {
                const [yyyy, mm] = d.split('-');
                if ((yr === 'all' || yyyy === yr) && !seenMo.has(mm)) {
                    seenMo.add(mm);
                    const opt = document.createElement('option');
                    opt.value = mm; opt.textContent = browseMonths[parseInt(mm) - 1];
                    mf.appendChild(opt);
                }
            });
        }

        document.getElementById('browse-year-filter').addEventListener('change', () => { rebuildBrowseMonthFilter(); renderBrowseList(); });
        document.getElementById('browse-month-filter').addEventListener('change', renderBrowseList);
        document.getElementById('browse-filter-clear').addEventListener('click', () => {
            document.getElementById('browse-year-filter').value = 'all';
            rebuildBrowseMonthFilter(); renderBrowseList();
        });

        async function loadBrowse() {
            const { data } = await db.from('entries').select('date').order('date', { ascending: false });
            if (!data) return;
            allBrowseFiles = data.map(r => r.date);
            const yf = document.getElementById('browse-year-filter');
            const seenYr = new Set();
            yf.innerHTML = '<option value="all">year</option>';
            allBrowseFiles.forEach(d => {
                const [yyyy] = d.split('-');
                if (!seenYr.has(yyyy)) {
                    seenYr.add(yyyy);
                    const opt = document.createElement('option');
                    opt.value = yyyy; opt.textContent = yyyy;
                    yf.appendChild(opt);
                }
            });
            rebuildBrowseMonthFilter();
            renderBrowseList();
        }

        function showHistoryView() {
            document.getElementById('entry-edit-view').style.display = 'none';
            document.getElementById('entry-history-view').style.display = '';
            if (!browseLoaded) { browseLoaded = true; loadBrowse(); }
        }

        function showEditView() {
            document.getElementById('entry-history-view').style.display = 'none';
            document.getElementById('entry-edit-view').style.display = '';
        }

        document.getElementById('history-btn').addEventListener('click', showHistoryView);
        document.getElementById('history-back-btn').addEventListener('click', showEditView);
    </script>
</body>
</html>
