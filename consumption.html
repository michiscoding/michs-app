<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>consumption</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="mishi">
    <style>
        .c-search-row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; margin-top: 0.25rem; }
        .c-search-row input { flex: 1; background: #ededed; border: none; border-radius: 8px; padding: 0.5rem 0.85rem; font-family: inherit; font-size: 0.85rem; color: #111; outline: none; }
        body.dark .c-search-row input { background: #2a2a2a; color: #ddd; }
        .c-search-row .btn-app { padding: 0.5rem 0.85rem; font-size: 0.82rem; white-space: nowrap; }
        .c-search-results { margin-bottom: 0.5rem; }
        .c-list-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #ccc; margin: 0.85rem 0 0.4rem; }
        body.dark .c-list-label { color: #444; }

        .browse-tag-pills { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.4rem 0 0.85rem; }
        .browse-tag-pill { background: none; border: 1px solid #e0e0e0; border-radius: 999px; padding: 0.18rem 0.65rem; font-family: inherit; font-size: 0.68rem; font-weight: 600; color: #aaa; cursor: pointer; transition: all 0.12s; }
        .browse-tag-pill.active { background: #222; border-color: #222; color: #fff; }
        body.dark .browse-tag-pill { border-color: #2a2a2a; color: #555; }
        body.dark .browse-tag-pill.active { background: #ddd; border-color: #ddd; color: #111; }
        .browse-alpha-label { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #ccc; margin: 0.9rem 0 0.15rem; pointer-events: none; }
        body.dark .browse-alpha-label { color: #383838; }
        .c-results-section-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #ccc; margin: 0.6rem 0 0.2rem; }
        .c-results-section-label:first-child { margin-top: 0; }
        body.dark .c-results-section-label { color: #444; }

        .edit-star-row { display: flex; gap: 0.25rem; }
        .edit-star { position: relative; background: none; border: none; font-size: 1.5rem; color: #ddd; cursor: pointer; padding: 0; line-height: 1; transition: color 0.1s; }
        .edit-star.filled { color: #f5a623; }
        .edit-star.half-filled { color: #ddd; }
        .edit-star.half-filled::after { content: '★'; position: absolute; left: 0; top: 0; width: 50%; overflow: hidden; color: #f5a623; pointer-events: none; }
        body.dark .edit-star { color: #444; }
        body.dark .edit-star.filled, body.dark .edit-star.half-filled::after { color: #f5a623; }

        .media-scroll-row { display: flex; gap: 0.5rem; overflow-x: auto; margin-top: 0.75rem; scrollbar-width: none; -ms-overflow-style: none; }
        .media-scroll-row::-webkit-scrollbar { display: none; }
        .media-thumb-wrap { position: relative; flex: 0 0 auto; width: 140px; }
        .media-thumb { width: 140px; height: 110px; object-fit: cover; border-radius: 8px; display: block; }

        .attach-remove-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; flex-shrink: 0; }
        .attach-remove-btn:hover { color: #555; }
        .vid-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 0; border-bottom: 1px solid #f0f0f0; }
        body.dark .vid-row { border-bottom-color: #1e1e1e; }
        .vid-row-info { flex: 1; min-width: 0; }
        .vid-row-title { font-size: 0.82rem; font-weight: 600; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        body.dark .vid-row-title { color: #bbb; }
        .vid-row-url { font-size: 0.72rem; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>

<body>

    <div class="entry-container" id="list-view">
        <button type="button" id="list-back-btn" class="list-back-btn" aria-label="back">←</button>

        <div class="edit-tabs edit-subtabs" id="consumption-subtabs">

            <button type="button" class="edit-tab" data-csub="movies">movies</button>

                    <div class="edit-tabs edit-subtabs" id="mv-editor-status-tabs">

                <div class="field-group"><label class="field-label">rating</label><div class="edit-star-row" id="mv-stars"><button type="button" class="edit-star" data-prefix="mv" data-val="1">★</button><button type="button" class="edit-star" data-prefix="mv" data-val="2">★</button><button type="button" class="edit-star" data-prefix="mv" data-val="3">★</button><button type="button" class="edit-star" data-prefix="mv" data-val="4">★</button><button type="button" class="edit-star" data-prefix="mv" data-val="5">★</button></div></div>

                <div class="c-search-results" id="fd-search-results"></div>

                    <button type="button" id="vn-delete-btn" class="danger-btn">delete</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/app.js"></script>
    <script src="js/nav.js"></script>
    <script>
        const backBtn = document.getElementById('list-back-btn');

        function setBackVisible(visible) { backBtn.style.visibility = visible ? 'visible' : 'hidden'; }

        function revealTab(el) {
            el.style.opacity = '0';
            requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = '1'; }));
        }

        function mimeType(file) {
            if (file.type) return file.type;
            const ext = file.name.split('.').pop().toLowerCase();
            return { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp' }[ext] || 'application/octet-stream';
        }

        // subtabs
        const csubEls = {
            books: document.getElementById('csub-books'),
            movies: document.getElementById('csub-movies'),
            tv: document.getElementById('csub-tv'),
            food: document.getElementById('csub-food'),
            venues: document.getElementById('csub-venues'),
            videos: document.getElementById('csub-videos'),
        };
        let activeCsub = 'books';
        let booksLoaded = false, moviesLoaded = false, tvLoaded = false, foodLoaded = false, venueLoaded = false, videosLoaded = false;

        document.querySelectorAll('#consumption-subtabs .edit-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#consumption-subtabs .edit-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeCsub = btn.dataset.csub;
                Object.entries(csubEls).forEach(([k, el]) => { el.style.display = k === activeCsub ? 'block' : 'none'; });
                if (activeCsub === 'books' && !booksLoaded) { booksLoaded = true; loadMediaList('book'); }
                if (activeCsub === 'movies' && !moviesLoaded) { moviesLoaded = true; loadMediaList('movie'); }
                if (activeCsub === 'tv' && !tvLoaded) { tvLoaded = true; loadMediaList('tv'); }
                if (activeCsub === 'food' && !foodLoaded) { foodLoaded = true; loadFoodList(); }
                if (activeCsub === 'venues' && !venueLoaded) { venueLoaded = true; loadVenueList(); }
                if (activeCsub === 'videos' && !videosLoaded) { videosLoaded = true; loadVideosList(); }
                collapseMediaEditors();
            });
        });

        function collapseMediaEditors() {
            ['books','movies','tv'].forEach(t => {
                document.getElementById(`${t}-editor-view`).style.display = 'none';
                document.getElementById(`${t}-list-view`).style.display = '';
            });
            document.getElementById('food-editor-view').style.display = 'none';
            document.getElementById('food-list-view').style.display = '';
            document.getElementById('venue-editor-view').style.display = 'none';
            document.getElementById('venue-list-view').style.display = '';
            document.getElementById('videos-editor-view').style.display = 'none';
            document.getElementById('videos-list-view').style.display = '';
            ['bk','mv','tv','fd','vn'].forEach(p => {
                const sec = document.getElementById(`${p}-search-section`);
                if (sec) sec.style.display = '';
                const res = document.getElementById(`${p}-search-results`);
                if (res) res.innerHTML = '';
            });
            setBackVisible(false);
        }

        backBtn.addEventListener('click', () => { collapseMediaEditors(); });

        // --- star ratings ---
        const editRatings = { bk: 0, mv: 0, tv: 0, fd: 0, vn: 0 };

        function setEditRating(prefix, val) {
            editRatings[prefix] = val;
            document.querySelectorAll(`.edit-star[data-prefix="${prefix}"]`).forEach(btn => {
                const btnVal = parseInt(btn.dataset.val);
                btn.classList.remove('filled', 'half-filled');
                if (val >= btnVal) btn.classList.add('filled');
                else if (val >= btnVal - 0.5) btn.classList.add('half-filled');
            });
        }

        document.querySelectorAll('.edit-star').forEach(btn => {
            btn.addEventListener('click', e => {
                const prefix = btn.dataset.prefix;
                const rect = btn.getBoundingClientRect();
                const isLeft = e.clientX - rect.left < rect.width / 2;
                const fullVal = parseInt(btn.dataset.val);
                const val = isLeft ? fullVal - 0.5 : fullVal;
                setEditRating(prefix, editRatings[prefix] === val ? 0 : val);
            });
        });

        // --- movie status ---
        let mvActiveStatus = 'watched', mvEditorStatus = 'watched';
        document.querySelectorAll('#mv-status-tabs .edit-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#mv-status-tabs .edit-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mvActiveStatus = btn.dataset.mvstatus;
                moviesLoaded = false; loadMediaList('movie');
            });
        });
        document.querySelectorAll('#mv-editor-status-tabs .edit-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#mv-editor-status-tabs .edit-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mvEditorStatus = btn.dataset.edstatus;
            });
        });
        function setMvEditorStatus(status) {
            mvEditorStatus = status || 'watched';
            document.querySelectorAll('#mv-editor-status-tabs .edit-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.edstatus === mvEditorStatus));
            const isWatchlist = mvEditorStatus === 'want';
            document.getElementById('mv-stars').closest('.field-group').style.display = isWatchlist ? 'none' : '';
            document.getElementById('mv-date').closest('.field-group').style.display = isWatchlist ? 'none' : '';
        }

        // --- tv status ---
        let tvActiveStatus = 'watching', tvEditorStatus = 'watching';
        document.querySelectorAll('#tv-status-tabs .edit-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#tv-status-tabs .edit-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tvActiveStatus = btn.dataset.tvstatus;
                tvLoaded = false; loadMediaList('tv');
            });
        });
        document.querySelectorAll('#tv-editor-status-tabs .edit-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#tv-editor-status-tabs .edit-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tvEditorStatus = btn.dataset.edtvstatus;
                setTvEditorStatus(tvEditorStatus);
            });
        });
        function setTvEditorStatus(status) {
            tvEditorStatus = status || 'watching';
            document.querySelectorAll('#tv-editor-status-tabs .edit-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.edtvstatus === tvEditorStatus));

            const allTags = [...new Set(data.flatMap(d => d.tags || []))].sort();

            const filtered = activeTag === 'all' ? data : data.filter(d => d.tags?.includes(activeTag));
            if (!filtered.length) { const empty = document.createElement('div'); empty.style.cssText = 'color:#aaa;font-size:0.8rem;padding:0.35rem 0'; empty.textContent = 'nothing with that tag'; listEl.appendChild(empty); return; }
            const groups = {};
            filtered.forEach(item => {
                const ch = (item.name?.[0] || '#').toUpperCase();
                const key = /[A-Z]/.test(ch) ? ch : '#';
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });
            const keys = Object.keys(groups).filter(k => k !== '#').sort();
            if (groups['#']) keys.push('#');
            keys.forEach(letter => {
                const hdr = document.createElement('div');
                hdr.className = 'browse-alpha-label'; hdr.textContent = letter;
                listEl.appendChild(hdr);

                    row.addEventListener('click', () => onItemClick(item.id));
                    listEl.appendChild(row);
                });
            });

        async function searchBooksC(q) {
            const el = document.getElementById('bk-search-results');

                const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=6&key=${GOOGLE_KEY}`);
                const data = await res.json();
                renderCSearchResults('bk', (data.items || []).map(b => {

        async function searchFoodC(q) {
            const el = document.getElementById('fd-search-results');
            el.innerHTML = '<div style="font-size:0.8rem;color:#aaa;padding:0.4rem 0">searching...</div>';

            let places = [];

                const res = await fetch('https://places.googleapis.com/v1/places:searchText', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': GOOGLE_KEY, 'X-Goog-FieldMask': 'places.id,places.displayName,places.shortFormattedAddress,places.photos' }, body: JSON.stringify({ textQuery: q, pageSize: 5 }) });

        function openMediaEditorForAdd(type, item) {
            const p = type === 'book' ? 'bk' : type === 'tv' ? 'tv' : 'mv';
            const listKey = type === 'book' ? 'books' : type === 'tv' ? 'tv' : 'movies';
            currentMediaId = null; currentMediaType = type; currentMediaCoverUrl = item.cover || null;
            document.getElementById(`${p}-title`).value = item.title || '';
            document.getElementById(`${p}-notes`).value = '';
            setEditRating(p, 0);
            document.getElementById(`${p}-date`).value = '';
            if (type === 'movie') setMvEditorStatus(mvActiveStatus);
            if (type === 'tv') setTvEditorStatus(tvActiveStatus);
            document.getElementById(`${p}-delete-btn`).style.display = 'none';
            document.getElementById(`${p}-search-section`).style.display = 'none';
            document.getElementById(`${listKey}-list-view`).style.display = 'none';
            document.getElementById(`${listKey}-editor-view`).style.display = '';
            revealTab(document.getElementById(`${listKey}-editor-view`));
            setBackVisible(true);
        }

            currentFoodId = null; currentFoodPlaceId = item.placeId || null; currentFoodNewPhotoUrl = null;
            if (item.photoName) currentFoodNewPhotoUrl = `https://places.googleapis.com/v1/${item.photoName}/media?maxWidthPx=800&key=${GOOGLE_KEY}`;
            fdPhotos = []; fdDeletedPhotoIds = new Set();
            document.getElementById('fd-name').value = item.title || '';
            document.getElementById('fd-location').value = item.sub || '';
            document.getElementById('fd-tags').value = ''; document.getElementById('fd-notes').value = '';
            setEditRating('fd', 0);
            document.getElementById('fd-dates-container').innerHTML = '';
            addFdDateRow(new Date().toISOString().slice(0,10));
            renderFdPhotos();
            document.getElementById('fd-delete-btn').style.display = 'none';
            document.getElementById('fd-search-section').style.display = 'none';

        document.getElementById('bk-search-btn').addEventListener('click', () => { const q = document.getElementById('bk-search-input').value.trim(); if (q) searchBooksC(q); });

            clearTimeout(fdSearchDebounce);

            clearTimeout(vnSearchDebounce);

        // --- videos ---
        function parseMediaUrl(url) {
            const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/);
            if (yt) return { type: 'youtube', id: yt[1] };
            const sp = url.match(/spotify\.com\/(playlist|album|track|episode)\/([A-Za-z0-9]+)/);
            if (sp) return { type: 'spotify', spotifyType: sp[1], id: sp[2] };
            return null;
        }

        async function loadVideosList() {
            const listEl = document.getElementById('videos-list');
            listEl.innerHTML = '<div style="color:#aaa;font-size:0.8rem;padding:0.5rem 0">loading...</div>';
            const { data } = await db.from('videos').select('id, url, caption').order('created_at', { ascending: false });
            renderVideosList(data || []);
        }

        let currentVideoId = null;

        function renderVideosList(videos) {
            const listEl = document.getElementById('videos-list');
            listEl.innerHTML = '';
            if (!videos.length) { listEl.innerHTML = '<div style="color:#aaa;font-size:0.8rem;padding:0.5rem 0">none yet</div>'; return; }
            videos.forEach(video => {
                const parsed = parseMediaUrl(video.url);
                const row = document.createElement('div');
                row.className = 'vid-row'; row.style.cursor = 'pointer';
                let thumb;
                if (parsed?.type === 'youtube') {
                    thumb = `<img src="https://img.youtube.com/vi/${parsed.id}/mqdefault.jpg" style="width:80px;height:45px;object-fit:cover;border-radius:5px;flex-shrink:0;">`;
                } else if (parsed?.type === 'spotify') {
                    thumb = `<div style="width:80px;height:45px;background:#1db954;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;">♫</div>`;
                } else {
                    thumb = `<div style="width:80px;height:45px;background:#eee;border-radius:5px;flex-shrink:0;"></div>`;
                }
                row.innerHTML = `${thumb}
                    <div class="vid-row-info">
                        <div class="vid-row-title">${video.caption || video.url}</div>
                        ${video.caption ? `<div class="vid-row-url">${video.url}</div>` : ''}
                    </div>`;
                row.addEventListener('click', () => openVideoEditor(video));
                listEl.appendChild(row);
            });
        }

        function openVideoEditor(video) {
            currentVideoId = video.id;
            document.getElementById('vid-edit-url').value = video.url || '';
            document.getElementById('vid-edit-caption').value = video.caption || '';
            document.getElementById('videos-list-view').style.display = 'none';
            document.getElementById('videos-editor-view').style.display = '';
            setBackVisible(true);
        }

        document.getElementById('vid-save-btn').addEventListener('click', async () => {
            const btn = document.getElementById('vid-save-btn');
            const url = document.getElementById('vid-edit-url').value.trim();
            if (!url || !parseMediaUrl(url)) { btn.textContent = 'invalid url'; setTimeout(() => { btn.textContent = 'save'; }, 2000); return; }
            const caption = document.getElementById('vid-edit-caption').value.trim() || null;
            const adminDb = await getAdminClient(); if (!adminDb) return;
            btn.textContent = 'saving...'; btn.disabled = true;
            const { error } = await adminDb.from('videos').update({ url, caption }).eq('id', currentVideoId);
            btn.textContent = error ? 'error' : 'saved!'; btn.disabled = false;
            setTimeout(() => { btn.textContent = 'save'; }, 2000);
            if (!error) { videosLoaded = false; loadVideosList(); }
        });

        let vidDeletePending = false, vidDeleteTimer = null;
        document.getElementById('vid-delete-btn').addEventListener('click', async () => {
            const btn = document.getElementById('vid-delete-btn');
            if (!vidDeletePending) {
                vidDeletePending = true; btn.textContent = 'sure?';
                vidDeleteTimer = setTimeout(() => { vidDeletePending = false; btn.textContent = 'delete'; }, 3000);
                return;
            }
            clearTimeout(vidDeleteTimer); vidDeletePending = false;
            const adminDb = await getAdminClient(); if (!adminDb) return;
            btn.textContent = 'deleting...';
            await adminDb.from('videos').delete().eq('id', currentVideoId);
            currentVideoId = null;
            document.getElementById('videos-editor-view').style.display = 'none';
            document.getElementById('videos-list-view').style.display = '';
            setBackVisible(false); videosLoaded = false; loadVideosList();
        });

        document.getElementById('vid-add-btn').addEventListener('click', async () => {
            const url = document.getElementById('vid-url-input').value.trim();
            if (!url) return;
            if (!parseMediaUrl(url)) {
                const btn = document.getElementById('vid-add-btn');
                btn.textContent = 'not a youtube or spotify url'; btn.disabled = true;
                setTimeout(() => { btn.textContent = '+ add'; btn.disabled = false; }, 2500);
                return;
            }
            const caption = document.getElementById('vid-caption-input').value.trim() || null;
            const btn = document.getElementById('vid-add-btn');
            const adminDb = await getAdminClient(); if (!adminDb) return;
            btn.textContent = 'adding...'; btn.disabled = true;
            const { error } = await adminDb.from('videos').insert({ url, caption });
            btn.textContent = error ? 'error' : '+ add'; btn.disabled = false;
            if (!error) {
                document.getElementById('vid-url-input').value = '';
                document.getElementById('vid-caption-input').value = '';
                videosLoaded = false; loadVideosList();
            }
        });

        // load books on init
        loadMediaList('book');
        booksLoaded = true;
    </script>
