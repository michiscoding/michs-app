<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>work</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="mishi">
    <style>
        .text-toolbar { display: flex; gap: 0.4rem; margin-bottom: 0.4rem; }
        .toolbar-btn {
            background: none; border: 1px solid #ddd; border-radius: 4px;
            padding: 0.2rem 0.65rem; font-size: 0.72rem; font-family: inherit;
            font-weight: 600; letter-spacing: 0.03em; color: #999; cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .toolbar-btn:hover { color: #333; border-color: #aaa; }
        body.dark .toolbar-btn { border-color: #333; color: #555; }
        body.dark .toolbar-btn:hover { color: #ccc; border-color: #666; }

        .link-popup { display: none; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
        .link-popup input {
            border: none; border-bottom: 1px solid #ddd; background: none;
            outline: none; font-family: inherit; font-size: 0.85rem;
            padding: 0.2rem 0; color: #333; flex: 1; min-width: 80px;
        }
        body.dark .link-popup input { border-bottom-color: #444; color: #ccc; }
        .lp-insert {
            background: #222; color: #fff; border: none; border-radius: 4px;
            padding: 0.25rem 0.7rem; font-family: inherit; font-size: 0.75rem;
            font-weight: 600; cursor: pointer;
        }
        .lp-cancel { background: none; border: none; color: #bbb; cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 0; }
        .lp-cancel:hover { color: #555; }

        .attach-section { margin-top: 0.75rem; }
        #r-attach-input { display: none; }
        .attach-file-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: #666; margin-top: 0.5rem; }
        .attach-file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .attach-insert-btn {
            background: none; border: 1px solid #ddd; border-radius: 4px;
            padding: 0.15rem 0.55rem; font-size: 0.7rem; font-family: inherit;
            font-weight: 600; color: #888; cursor: pointer; white-space: nowrap;
        }
        .attach-insert-btn:hover { color: #111; border-color: #aaa; }
        .attach-remove-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; flex-shrink: 0; }
        .attach-remove-btn:hover { color: #555; }
        #r-create-attach-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            padding: 1.5rem; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        #r-create-attach-overlay.open { opacity: 1; pointer-events: auto; }
        #r-create-attach-modal {
            background: #fff; border-radius: 12px; padding: 1.75rem;
            width: 100%; max-width: 640px; max-height: 85vh;
            display: flex; flex-direction: column; gap: 0.75rem;
            box-shadow: 0 16px 48px rgba(0,0,0,0.25);
        }
        body.dark #r-create-attach-modal { background: #1a1a1a; }
        #r-attach-title {
            width: 100%; background: none; border: none;
            border-bottom: 1px solid #ddd; outline: none;
            font-family: inherit; font-size: 1rem; font-weight: 600;
            padding: 0.2rem 0; color: #111;
        }
        #r-attach-body {
            width: 100%; flex: 1; min-height: 280px; background: none;
            border: 1px solid #ddd; border-radius: 6px; outline: none;
            font-family: inherit; font-size: 0.85rem; line-height: 1.65;
            padding: 0.75rem; color: #111; resize: none; overflow-y: auto;
        }
        .r-attach-actions { display: flex; gap: 0.5rem; }
        body.dark #r-attach-title { border-bottom-color: #444; color: #ccc; }
        body.dark #r-attach-body { border-color: #444; color: #ccc; background: #111; }

        .media-scroll-row {
            display: flex; gap: 0.5rem; overflow-x: auto;
            margin-top: 0.75rem; scrollbar-width: none; -ms-overflow-style: none;
        }
        .media-scroll-row::-webkit-scrollbar { display: none; }
        .media-thumb-wrap { position: relative; flex: 0 0 auto; width: 140px; }
        .media-thumb { width: 140px; height: 110px; object-fit: cover; border-radius: 8px; display: block; }

        /* PA technical notes */
        .pa-note-block { border: 1px solid #e8e8e8; border-radius: 8px; padding: 0.85rem 0.9rem; margin-bottom: 0.6rem; }
        body.dark .pa-note-block { border-color: #252525; }
        .pa-note-header { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.6rem; }
        .pa-note-type-badge { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: #bbb; }
        body.dark .pa-note-type-badge { color: #444; }
        .pa-note-lang-select { background: none; border: 1px solid #e0e0e0; border-radius: 5px; padding: 0.18rem 0.45rem; font-family: inherit; font-size: 0.71rem; color: #666; outline: none; cursor: pointer; }
        body.dark .pa-note-lang-select { border-color: #333; color: #888; background: #1a1a1a; }
        .pa-note-spacer { flex: 1; }
        .pa-note-move-btn { background: none; border: none; font-size: 0.85rem; color: #ccc; cursor: pointer; padding: 0.1rem 0.2rem; line-height: 1; }
        .pa-note-move-btn:hover:not(:disabled) { color: #555; }
        .pa-note-move-btn:disabled { opacity: 0.25; cursor: default; }
        body.dark .pa-note-move-btn { color: #444; }
        body.dark .pa-note-move-btn:hover:not(:disabled) { color: #aaa; }
        .pa-note-del-btn { background: none; border: none; font-size: 1rem; color: #ccc; cursor: pointer; padding: 0.1rem 0.25rem; line-height: 1; margin-left: 0.15rem; }
        .pa-note-del-btn:hover { color: #e55; }
        .pa-note-code-ta { width: 100%; font-family: 'Courier New', Courier, monospace; font-size: 0.8rem; line-height: 1.55; border: 1px solid #e8e8e8; border-radius: 6px; padding: 0.55rem 0.75rem; resize: none; outline: none; background: #f9f9f9; color: #222; overflow: hidden; min-height: 60px; }
        body.dark .pa-note-code-ta { border-color: #252525; background: #111; color: #ccc; }
        .pa-note-attach-preview { width: 100%; max-height: 180px; object-fit: contain; border-radius: 6px; display: block; margin-bottom: 0.5rem; background: #f5f5f5; }
        body.dark .pa-note-attach-preview { background: #1a1a1a; }
        .pa-note-desc-ta { width: 100%; font-family: inherit; font-size: 0.83rem; line-height: 1.6; border: 1px solid #e8e8e8; border-radius: 6px; padding: 0.5rem 0.75rem; resize: none; outline: none; background: none; color: #444; margin-top: 0.5rem; overflow: hidden; min-height: 38px; }
        body.dark .pa-note-desc-ta { border-color: #252525; color: #aaa; }
        .pa-notes-add-row { display: flex; gap: 0.45rem; margin-top: 0.35rem; }
        .pa-notes-add-row .btn-app { font-size: 0.75rem; padding: 0.3rem 0.7rem; }
    </style>
</head>

<body>

    <div id="media-preview-lb" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:1000;align-items:center;justify-content:center;">
        <button type="button" id="media-preview-close" style="position:absolute;top:1rem;right:1.2rem;background:none;border:none;color:rgba(255,255,255,0.7);font-size:1.8rem;cursor:pointer;line-height:1;padding:0.2rem 0.4rem;">×</button>
        <img id="media-preview-img" style="max-width:92vw;max-height:92vh;object-fit:contain;display:none;border-radius:4px;">
        <video id="media-preview-vid" style="max-width:92vw;max-height:92vh;object-fit:contain;display:none;border-radius:4px;" controls autoplay loop playsinline></video>
    </div>

    <div class="entry-container" id="list-view">
        <button type="button" id="list-back-btn" class="list-back-btn" aria-label="back">←</button>
        <div class="edit-tabs edit-subtabs">
            <button type="button" class="edit-tab active" data-subtab="powerapps">powerapps</button>
            <button type="button" class="edit-tab" data-subtab="writings">records</button>
            <button type="button" class="edit-tab" data-subtab="resume">resume</button>
            <button type="button" class="btn-inline subtab-new-btn" id="pa-new-btn">+ new powerapps entry</button>
            <button type="button" class="btn-inline subtab-new-btn" id="r-new-btn">+ new record</button>
        </div>

        <div id="subtab-powerapps">
            <div id="pa-list-view">
                <div id="pa-records-list"></div>
            </div>
            <div id="pa-editor-view">
                <div class="field-group">
                    <label class="field-label">title</label>
                    <input type="text" id="pa-title" placeholder="e.g. approval flow" autocomplete="off">
                </div>
                <div class="field-group">
                    <label class="field-label">type</label>
                    <div class="tag-pills">
                        <button type="button" class="tag-pill" data-tag="flows">flows</button>
                        <button type="button" class="tag-pill" data-tag="pages">pages</button>
                        <button type="button" class="tag-pill" data-tag="apps">apps</button>
                    </div>
                </div>
                <div class="field-group">
                    <label class="field-label">media</label>
                    <input type="file" id="pa-media-input" accept="image/*,video/*" multiple aria-label="media files">
                    <button type="button" class="btn-app" onclick="document.getElementById('pa-media-input').click()">choose files</button>
                    <div id="pa-media-previews" class="media-scroll-row"></div>
                </div>
                <div class="field-group">
                    <label class="field-label">what it does</label>
                    <textarea id="pa-what" placeholder="describe what this does..."></textarea>
                </div>
                <div class="field-group">
                    <label class="field-label">how it works</label>
                    <textarea id="pa-how" placeholder="describe the technical build..."></textarea>
                </div>
                <div class="field-group">
                    <label class="field-label">technical notes</label>
                    <div id="pa-notes-list"></div>
                    <div class="pa-notes-add-row">
                        <button type="button" id="pa-add-code-btn" class="btn-app">+ code block</button>
                        <button type="button" id="pa-add-text-btn" class="btn-app">+ text</button>
                        <button type="button" id="pa-add-attach-btn" class="btn-app">+ attachment</button>
                    </div>
                </div>
                <div class="editor-actions">
                    <button type="button" id="pa-delete-btn" class="danger-btn">delete</button>
                    <button type="button" id="pa-save-btn" class="btn-app">save</button>
                </div>
            </div>
        </div>

        <div id="subtab-writings">
            <div id="r-list-view">
                <div id="r-records-list"></div>
            </div>
            <div id="r-editor-view">
                <div class="field-group">
                    <label class="field-label">title</label>
                    <input type="text" id="r-title" placeholder="title" autocomplete="off">
                </div>
                <div class="field-group">
                    <div class="text-toolbar">
                        <button type="button" class="toolbar-btn" id="r-link-btn">link ↗</button>
                    </div>
                    <div class="link-popup" id="r-link-popup">
                        <input type="text" id="r-lp-text" placeholder="link text">
                        <input type="text" id="r-lp-url" placeholder="url or /path">
                        <button type="button" class="lp-insert" id="r-lp-insert">insert</button>
                        <button type="button" class="lp-cancel" id="r-lp-cancel">×</button>
                    </div>
                    <textarea id="r-body" placeholder="write here..."></textarea>
                </div>
                <div class="field-group">
                    <label class="field-label">tags</label>
                    <input type="text" id="r-tags" placeholder="comma separated" autocomplete="off">
                </div>
                <div class="field-group">
                    <label class="field-label">attachment url</label>
                    <input type="text" id="r-attachment-url" placeholder="/reports/... or supabase url" autocomplete="off">
                    <div class="attach-section">
                        <input type="file" id="r-attach-input" multiple>
                        <div id="r-attach-list"></div>
                        <button type="button" class="toolbar-btn" id="r-attach-pick-btn">+ upload files</button>
                        <button type="button" class="toolbar-btn" id="r-create-attach-btn">+ create attachment</button>
                    </div>
                </div>
                <div class="editor-actions">
                    <button type="button" id="r-delete-btn" class="danger-btn">delete</button>
                    <button type="button" id="r-save-btn" class="btn-app">save</button>
                </div>
            </div>
        </div>

        <div id="subtab-resume">
            <div class="field-group">
                <label class="field-label">experience</label>
                <textarea id="exp-blurb" placeholder="e.g. creating power platform solutions for RSM since 2023..."></textarea>
            </div>
            <div class="field-group">
                <label class="field-label">education</label>
                <div id="edu-blocks"></div>
                <button type="button" id="add-edu-btn" aria-label="add school">+ add school</button>
            </div>
            <div class="field-group">
                <label class="field-label">certifications</label>
                <textarea id="certs" placeholder="Microsoft Certified: Power Platform Developer Associate"></textarea>
            </div>
            <button type="button" id="resume-save-btn" class="btn-app">save</button>
        </div>
    </div>

    <div id="r-create-attach-overlay">
        <div id="r-create-attach-modal">
            <input type="text" id="r-attach-title" placeholder="title" autocomplete="off">
            <textarea id="r-attach-body" placeholder="paste content here..."></textarea>
            <div class="r-attach-actions">
                <button type="button" class="lp-insert" id="r-attach-create-btn">create & attach</button>
                <button type="button" class="lp-cancel" id="r-attach-cancel-btn">×</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/app.js"></script>
    <script src="js/nav.js"></script>
    <script>
        const backBtn = document.getElementById('list-back-btn');
        let backContext = null;

        function setBackVisible(visible) {
            backBtn.style.visibility = visible ? 'visible' : 'hidden';
        }

        function setSiteLink(url) {
            document.querySelectorAll('.app-site-link').forEach(l => l.href = url || 'https://michiscoding.github.io/home.html');
        }

        function revealTab(el) {
            el.style.opacity = '0';
            requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = '1'; }));
        }

        function mimeType(file) {
            if (file.type) return file.type;
            const ext = file.name.split('.').pop().toLowerCase();
            return { html: 'text/html', htm: 'text/html', pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp' }[ext] || 'application/octet-stream';
        }

        function slugify(title) {
            return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        }

        // --- subtabs ---
        const subtabEls = {
            powerapps: document.getElementById('subtab-powerapps'),
            writings: document.getElementById('subtab-writings'),
            resume: document.getElementById('subtab-resume'),
        };
        const subtabs = document.querySelectorAll('.edit-subtabs .edit-tab');
        let paListLoaded = false, rListLoaded = false, resumeLoaded = false;

        subtabs.forEach(tab => {
            tab.addEventListener('click', () => {
                subtabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                Object.entries(subtabEls).forEach(([k, el]) => {
                    const show = k === tab.dataset.subtab;
                    el.style.display = show ? 'block' : 'none';
                    if (show) revealTab(el);
                });
                document.getElementById('pa-new-btn').style.display = tab.dataset.subtab === 'powerapps' ? 'inline' : 'none';
                document.getElementById('r-new-btn').style.display = tab.dataset.subtab === 'writings' ? 'inline' : 'none';
                if (paEditorView.style.display === 'block') {
                    paEditorView.style.display = 'none';
                    paListView.style.display = 'block';
                    paCurrentSlug = null;
                }
                if (rEditorView.style.display === 'block') {
                    rEditorView.style.display = 'none';
                    rListView.style.display = 'block';
                    rCurrentSlug = null;
                }
                setBackVisible(false);
                if (tab.dataset.subtab === 'powerapps' && !paListLoaded) { paListLoaded = true; loadPaList(); }
                if (tab.dataset.subtab === 'writings' && !rListLoaded) { rListLoaded = true; loadRList(); }
                if (tab.dataset.subtab === 'resume') {
                    loadResume();
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        ['exp-blurb', 'certs'].forEach(id => {
                            const ta = document.getElementById(id);
                            ta.style.height = 'auto';
                            ta.style.height = ta.scrollHeight + 'px';
                        });
                    }));
                }
            });
        });

        backBtn.addEventListener('click', () => {
            setBackVisible(false);
            if (backContext === 'pa') {
                paEditorView.style.display = 'none';
                paListView.style.display = 'block';
                revealTab(paListView);
                paCurrentSlug = null;
            } else if (backContext === 'r') {
                rEditorView.style.display = 'none';
                rListView.style.display = 'block';
                revealTab(rListView);
                rCurrentSlug = null;
            }
            backContext = null;
        });

        // --- media preview lightbox ---
        const mediaPreviewLb = document.getElementById('media-preview-lb');
        const mediaPreviewImg = document.getElementById('media-preview-img');
        const mediaPreviewVid = document.getElementById('media-preview-vid');

        function openMediaPreview(src, isVid) {
            mediaPreviewLb.style.display = 'flex';
            if (isVid) { mediaPreviewVid.src = src; mediaPreviewVid.style.display = ''; mediaPreviewImg.style.display = 'none'; }
            else { mediaPreviewImg.src = src; mediaPreviewImg.style.display = ''; mediaPreviewVid.style.display = 'none'; mediaPreviewVid.src = ''; }
        }

        function closeMediaPreview() { mediaPreviewLb.style.display = 'none'; mediaPreviewVid.src = ''; }
        document.getElementById('media-preview-close').addEventListener('click', closeMediaPreview);
        mediaPreviewLb.addEventListener('click', e => { if (e.target === mediaPreviewLb) closeMediaPreview(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && mediaPreviewLb.style.display !== 'none') closeMediaPreview(); });

        // --- powerapps ---
        let paMedia = [], paSelectedTags = new Set(), paCurrentSlug = null;
        let paCurrentNotes = [], paDeletedNoteIds = new Set();
        const paListView = document.getElementById('pa-list-view');
        const paEditorView = document.getElementById('pa-editor-view');
        paEditorView.style.display = 'none';

        document.getElementById('pa-new-btn').addEventListener('click', () => {
            paCurrentSlug = null;
            paMedia = []; paSelectedTags = new Set(); paDeletedNoteIds = new Set(); paCurrentNotes = [];
            document.getElementById('pa-title').value = '';
            document.getElementById('pa-what').value = '';
            document.getElementById('pa-how').value = '';
            document.getElementById('pa-media-previews').innerHTML = '';
            document.getElementById('pa-notes-list').innerHTML = '';
            document.querySelectorAll('.tag-pill').forEach(p => p.classList.remove('selected'));
            setSiteLink('https://michiscoding.github.io/powerapps.html');
            backContext = 'pa';
            paListView.style.display = 'none';
            paEditorView.style.display = 'block';
            revealTab(paEditorView);
            setBackVisible(true);
            document.getElementById('pa-title').focus();
        });

        function renderPaMedia() {
            const previews = document.getElementById('pa-media-previews');
            previews.innerHTML = '';
            paMedia.forEach((item, i) => {
                const wrap = document.createElement('div');
                wrap.className = 'media-thumb-wrap';
                const isVid = item.type === 'new' ? item.file.type.startsWith('video/') : /\.(mp4|webm|mov)$/i.test(item.path);
                const src = item.type === 'new' ? item.src : MEDIA_BASE + item.path;
                let el;
                if (isVid) { el = document.createElement('video'); el.src = src; el.muted = true; el.autoplay = true; el.loop = true; el.playsInline = true; }
                else { el = document.createElement('img'); el.src = src; el.alt = ''; }
                el.className = 'media-thumb'; el.style.cursor = 'zoom-in';
                el.addEventListener('click', () => openMediaPreview(src, isVid));
                const removeBtn = document.createElement('button');
                removeBtn.type = 'button'; removeBtn.className = 'remove-btn'; removeBtn.textContent = '×';
                removeBtn.addEventListener('click', () => { paMedia.splice(i, 1); renderPaMedia(); });
                const prevBtn = document.createElement('button');
                prevBtn.type = 'button'; prevBtn.className = 'photo-move-btn photo-move-prev'; prevBtn.textContent = '←'; prevBtn.disabled = i === 0;
                prevBtn.addEventListener('click', () => { [paMedia[i], paMedia[i-1]] = [paMedia[i-1], paMedia[i]]; renderPaMedia(); });
                const nextBtn = document.createElement('button');
                nextBtn.type = 'button'; nextBtn.className = 'photo-move-btn photo-move-next'; nextBtn.textContent = '→'; nextBtn.disabled = i === paMedia.length - 1;
                nextBtn.addEventListener('click', () => { [paMedia[i], paMedia[i+1]] = [paMedia[i+1], paMedia[i]]; renderPaMedia(); });
                wrap.appendChild(el); wrap.appendChild(removeBtn); wrap.appendChild(prevBtn); wrap.appendChild(nextBtn);
                previews.appendChild(wrap);
            });
        }

        const PA_LANGS = [
            {id:'powerfx',label:'PowerFx'},{id:'javascript',label:'JavaScript'},{id:'typescript',label:'TypeScript'},
            {id:'html',label:'HTML'},{id:'css',label:'CSS'},{id:'csharp',label:'C#'},
            {id:'python',label:'Python'},{id:'sql',label:'SQL'},{id:'json',label:'JSON'},{id:'m',label:'Power Query (M)'},{id:'powershell',label:'PowerShell'}
        ];

        function renderPaNotes() {
            const list = document.getElementById('pa-notes-list');
            list.innerHTML = '';
            paCurrentNotes.forEach((note, idx) => {
                const block = document.createElement('div');
                block.className = 'pa-note-block';
                const header = document.createElement('div');
                header.className = 'pa-note-header';
                const badge = document.createElement('span');
                badge.className = 'pa-note-type-badge'; badge.textContent = note.type;
                header.appendChild(badge);
                if (note.type === 'code') {
                    const langSel = document.createElement('select');
                    langSel.className = 'pa-note-lang-select';
                    PA_LANGS.forEach(l => {
                        const opt = document.createElement('option');
                        opt.value = l.id; opt.textContent = l.label;
                        if (l.id === (note.language || 'powerfx')) opt.selected = true;
                        langSel.appendChild(opt);
                    });
                    langSel.addEventListener('change', () => { paCurrentNotes[idx].language = langSel.value; });
                    header.appendChild(langSel);
                }
                const spacer = document.createElement('span');
                spacer.className = 'pa-note-spacer';
                header.appendChild(spacer);
                const upBtn = document.createElement('button');
                upBtn.type = 'button'; upBtn.className = 'pa-note-move-btn'; upBtn.textContent = '↑'; upBtn.disabled = idx === 0;
                upBtn.addEventListener('click', () => { if (idx > 0) { [paCurrentNotes[idx], paCurrentNotes[idx-1]] = [paCurrentNotes[idx-1], paCurrentNotes[idx]]; renderPaNotes(); } });
                const downBtn = document.createElement('button');

            const existing = checkRes.ok ? await checkRes.json() : null;
            const body = { message: `upload ${file.name}`, content, branch: BRANCH };
            if (existing?.sha) body.sha = existing.sha;
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

            await adminDb.from('records').delete().eq('slug', rCurrentSlug);
            rCurrentSlug = null;
            rEditorView.style.display = 'none'; rListView.style.display = 'block';
            setBackVisible(false); rListLoaded = false; loadRList();
        });

        // --- resume ---
        const RESUME_PATH = 'work/resume.html';

        function addEduBlock(data = {}) {
            const container = document.getElementById('edu-blocks');
            const block = document.createElement('div');
            block.className = 'edu-block-form';
            block.innerHTML = `
                <input type="text" class="edu-school" placeholder="school name" autocomplete="off" value="${data.school || ''}">
                <div class="field-row">
                    <input type="text" class="edu-program" placeholder="degree / program" autocomplete="off" value="${data.program || ''}">
                    <input type="text" class="edu-location-input" placeholder="city, state" autocomplete="off" value="${data.location || ''}">
                    <input type="text" class="edu-date-input" placeholder="may 2023" autocomplete="off" value="${data.date || ''}">
                </div>
                <textarea class="edu-courses" placeholder="relevant coursework...">${data.courses || ''}</textarea>
                <button type="button" class="remove-edu-btn">remove</button>
            `;
            block.querySelector('.remove-edu-btn').addEventListener('click', () => block.remove());
            block.querySelector('.edu-courses').addEventListener('input', function() {
                if (this.scrollHeight > this.clientHeight) this.style.height = this.scrollHeight + 'px';
            });
            container.appendChild(block);
        }

        document.getElementById('add-edu-btn').addEventListener('click', () => addEduBlock());

        async function loadResume() {
            if (resumeLoaded) return;
            const token = getToken(); if (!token) return;
            const btn = document.getElementById('resume-save-btn');
            btn.textContent = 'loading...';
            try {
                const apiRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${RESUME_PATH}`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!apiRes.ok) { btn.textContent = 'save'; return; }
                const apiData = await apiRes.json();
                const rawRes = await fetch(apiData.download_url);
                const html = await rawRes.text();
                btn.textContent = 'save'; resumeLoaded = true;
                const doc = new DOMParser().parseFromString(html, 'text/html');
                doc.querySelectorAll('.resume-section').forEach(section => {
                    const label = section.querySelector('h2')?.textContent.trim().toLowerCase();
                    if (label === 'experience') {
                        const blurb = Array.from(section.querySelectorAll('.entry-content p')).find(p => !p.querySelector('a'));
                        const ta = document.getElementById('exp-blurb');
                        ta.value = blurb ? blurb.textContent.trim() : '';
                    }
                    if (label === 'education') {
                        document.getElementById('edu-blocks').innerHTML = '';
                        section.querySelectorAll('.edu-block').forEach(block => {
                            const meta = block.querySelector('.edu-meta')?.textContent || '';
                            const locParts = meta.split('·');
                            addEduBlock({ school: block.querySelector('.edu-school')?.textContent.trim() || '', program: block.querySelector('.edu-degree')?.textContent.trim() || '', location: locParts[0]?.trim() || '', date: locParts[1]?.trim() || '', courses: block.querySelector('.edu-courses')?.textContent.trim() || '' });
                        });
                    }
                    if (label === 'certifications') {
                        const ta = document.getElementById('certs');
                        const items = section.querySelectorAll('.cert-list li, .entry-content i');
                        ta.value = Array.from(items).map(el => el.textContent.trim()).join('\n');
                    }
                });
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    ['exp-blurb', 'certs'].forEach(id => {
                        const ta = document.getElementById(id);
                        ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
                    });
                }));
            } catch(e) { console.error(e); document.getElementById('resume-save-btn').textContent = 'save'; }
        }

        document.getElementById('exp-blurb').addEventListener('input', function() { if (this.scrollHeight > this.clientHeight) this.style.height = this.scrollHeight + 'px'; });
        document.getElementById('certs').addEventListener('input', function() { if (this.scrollHeight > this.clientHeight) this.style.height = this.scrollHeight + 'px'; });

        document.getElementById('resume-save-btn').addEventListener('click', async () => {
            const token = getToken(); if (!token) return;
            const eduBlocks = document.querySelectorAll('.edu-block-form');
            const btn = document.getElementById('resume-save-btn');
            btn.textContent = 'saving...'; btn.disabled = true;
            const certItems = document.getElementById('certs').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>`          <li><i>${l}</i></li>`).join('\n');
            const eduHTML = Array.from(eduBlocks).map(block => {
                const school = block.querySelector('.edu-school').value.trim();
                const program = block.querySelector('.edu-program').value.trim();
                const location = block.querySelector('.edu-location-input').value.trim();
                const date = block.querySelector('.edu-date-input').value.trim();
                const courses = block.querySelector('.edu-courses').value.trim();
                const lines = [`        <div class="edu-block"><div class="edu-header"><span class="edu-school">${school}</span><span class="edu-meta">${location} · ${date}</span></div>`];
                if (program) lines.push(`          <div class="edu-degree">${program}</div>`);
                if (courses) lines.push(`          <div class="edu-courses">${courses}</div>`);
                lines.push('        </div>');
                return lines.join('\n');
            }).join('\n');
            const expBlurb = document.getElementById('exp-blurb').value.trim();
            const html = ['<!doctype html><html lang="en"><head>','    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">','    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">','    <link rel="stylesheet" href="/css/bootstrap.min.css">','    <link rel="stylesheet" href="/css/home.css"><link rel="stylesheet" href="/css/entry.css"><link rel="stylesheet" href="/css/resume.css">','    <style>:root{--maxWidth:67vw;}</style><title>resume</title></head><body>','  <div class="entry-container"><h1>resume</h1>','    <div class="resume-section"><h2>experience</h2><div class="entry-content">',`      <p>${expBlurb}</p><p>→ <a class="resume-link" href="/work.html#powerapps">see the work</a></p>`,'    </div></div>','    <div class="resume-section"><h2>education</h2><div class="entry-content">',eduHTML,'    </div></div>','    <div class="resume-section"><h2>certifications</h2><div class="entry-content"><ul class="cert-list">',certItems,'    </ul></div></div>','  </div><\/body><script src="/js/home.js"><\/script><\/html>'].join('\n');
            const encoded = btoa(unescape(encodeURIComponent(html)));
            const check = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${RESUME_PATH}`, { headers: { 'Authorization': `Bearer ${token}` } });
            const existing = await check.json();
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${RESUME_PATH}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'update resume', content: encoded, sha: existing.sha, branch: BRANCH }) });
            if (res.ok) { btn.textContent = 'saved!'; setTimeout(() => { btn.textContent = 'save'; btn.disabled = false; }, 2000); }
            else { btn.textContent = 'error'; btn.disabled = false; }
        });

        // load powerapps on init
        loadPaList();
    </script>
</body>
</html>
